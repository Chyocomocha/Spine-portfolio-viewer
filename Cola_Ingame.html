<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Spine Project</title>
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">
<style>
    /* 1. 배경 설정 (노션 다크모드 위장색 #191919) */
    html, body { 
        margin: 0; padding: 0; 
        background-color: #191919 !important; 
        color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; 
    }

    /* 플레이어 자체 배경 제거 */
    .spine-player, .spine-player-canvas {
        background-color: #191919 !important;
    }

    /* 2. 플레이어 크기 */
    #player-container { width: 100%; height: 75vh; margin-bottom: 10px; }

    /* 3. 컨트롤 패널 디자인 */
    .control-panel { 
        width: 95%; max-width: 800px; 
        display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; 
    }

    /* 버튼을 감싸는 반투명 박스 디자인 */
    .track-group { 
        background: rgba(0, 0, 0, 0.6); 
        padding: 15px; border-radius: 8px; 
        flex: 1; min-width: 250px; max-width: 800px; 
    }

    /* 소제목 스타일 */
    .group-title { 
        font-weight: bold; margin-bottom: 10px; color: #ccc; 
        text-transform: uppercase; font-size: 0.85em; 
        border-bottom: 1px solid #555; padding-bottom: 5px; 
    }

    /* 버튼 그리드 배치 */
    .btn-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); 
        gap: 6px; 
    }
    
    /* 버튼 공통 디자인 (색상 통일) */
    button { 
        padding: 10px 5px; cursor: pointer; 
        background: #444; color: white; border: 1px solid #555; border-radius: 4px; 
        font-size: 0.9em; transition: 0.2s; 
    }
    button:hover { background: #666; transform: translateY(-2px); border-color: #888; }
    button:active { transform: translateY(0px); }
</style>
</head>
<body>

<div id="player-container"></div>

<div class="control-panel">
    <div class="track-group">
        <div class="group-title">Animations</div>
        <div class="btn-grid">
            <!-- 지정해주신 순서대로 배치 (Entrance는 마지막에 추가) -->
            <button onclick="playAnim('Idle')">Idle</button>
            <button onclick="playAnim('Move')">Move</button>
            <button onclick="playAnim('Attack')">Attack</button>
            <button onclick="playAnim('Death')">Death</button>
            <button onclick="playAnim('Groggy')">Groggy</button>
            <button onclick="playAnim('Victory')">Victory</button>
            <button onclick="playAnim('Low_Grade')">Low_Grade</button>
            <button onclick="playAnim('High_Grade')">High_Grade</button>
            <button onclick="playAnim('Entrance')">Entrance</button>
        </div>
    </div>
</div>

<script src="./spine-lifecycle.js?v=3"></script>
<script>
    let player;

    // 스켈레톤 이름이 달라졌을 수 있으니 파일명 확인이 필요합니다.
    const CONFIG = {
        skelUrl: "./Ingame_Cola.skel.bytes", 
        atlasUrl: "./Ingame_Cola.atlas.txt"
    };

    new spine.SpinePlayer("player-container", {
        skelUrl: CONFIG.skelUrl,
        atlasUrl: CONFIG.atlasUrl,
        
        showControls: true, 
        
        backgroundColor: "#191919", 
        alpha: true,                  
        premultipliedAlpha: true,

        success: function (p) {
            player = p;
            
            // 애니메이션 믹스 시간을 기본값인 0.2초로 복구하여 부드럽게 전환
            player.animationState.data.defaultMix = 0.2; 
            console.log("로딩 성공");
            
            try { player.animationState.setAnimation(0, "Idle", true); } catch(e) {}
        },
        error: function (p, e) {
            console.error("Error:", e);
        }
    });

    // --- 기능 구현 ---
    function playAnim(name) {
        if (!player) return;

        // Death, Attack, Entrance, Victory는 1번만 재생(false), 나머지는 무한 반복(true)
        let isLoop = !['Death', 'Attack', 'Entrance', 'Victory'].includes(name);

        try {
            player.animationState.setAnimation(0, name, isLoop);
        } catch (e) {
            console.warn("애니메이션 없음: " + name);
        }
    }
</script>

</body>
</html>
