<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine Animation Viewer</title>
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2/dist/spine-player.css">
<style>
    html, body { 
        margin: 0; padding: 0; 
        background-color: #191919 !important; 
        color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; 
    }

    .spine-player, .spine-player-canvas {
        background-color: #191919 !important;
    }

    #player-container { width: 100%; height: 75vh; margin-bottom: 10px; }

    .control-panel { 
        width: 95%; max-width: 800px; 
        display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; 
    }

    .track-group { 
        background: rgba(0, 0, 0, 0.6); 
        padding: 15px; border-radius: 8px; 
        flex: 1; min-width: 250px; max-width: 800px; 
    }

    .group-title { 
        font-weight: bold; margin-bottom: 10px; color: #ccc; 
        text-transform: uppercase; font-size: 0.85em; 
        border-bottom: 1px solid #555; padding-bottom: 5px; 
    }

    .btn-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
        gap: 8px; 
    }
    
    button { 
        padding: 12px 5px; cursor: pointer; 
        background: #444; color: white; border: 1px solid #555; border-radius: 4px; 
        font-size: 0.95em; transition: 0.2s; 
    }
    button:hover { background: #666; transform: translateY(-2px); border-color: #888; }
    button:active { transform: translateY(0px); }
</style>
</head>
<body>

<div id="player-container"></div>

<div class="control-panel">
    <div class="track-group">
        <div class="group-title">Character Actions</div>
        <div class="btn-grid">
            <button onclick="playAnim('idle')">Idle</button>
            <button onclick="playAnim('groundsmash')">Ground Smash</button>
            <button onclick="playAnim('rockthrow')">Rock Throw</button>
            <button onclick="playAnim('death')">Death</button>
        </div>
    </div>
</div>

<script src="./spine-lifecycle.js"></script>
<script>
    let player;

    const CONFIG = {
        skelUrl: "./CragorBoss.skel.bytes", // 파일 경로 입력
        atlasUrl: "./CragorBoss.atlas.txt" // 파일 경로 입력
    };

    new spine.SpinePlayer("player-container", {
        skelUrl: CONFIG.skelUrl,
        atlasUrl: CONFIG.atlasUrl,
        showControls: false, 
        backgroundColor: "#191919", 
        alpha: true,                  
        premultipliedAlpha: true,

        success: function (p) {
            player = p;
            player.animationState.data.defaultMix = 0.2; 
            
            try { 
                player.animationState.setAnimation(0, "idle", true); 
            } catch(e) { console.warn("초기 애니메이션 재생 실패"); }
        },
        error: function (p, e) {
            console.error("Error:", e);
        }
    });

    function playAnim(name) {
        if (!player) return;

        try {
            if (name === 'idle') {
                player.animationState.setAnimation(0, name, true);
            } 
            else if (name === 'death') {
                // 죽음은 1번만 재생하고 마지막 프레임에서 정지
                player.animationState.setAnimation(0, name, false);
            } 
            else {
                // groundsmash, rockthrow 등 공격 동작
                player.animationState.setAnimation(0, name, false);
                // 동작 완료 후 다시 idle 무한 반복으로 연결
                player.animationState.addAnimation(0, "idle", true, 0);
            }
        } catch (e) {
            console.warn("애니메이션 실행 오류: " + name);
        }
    }
</script>

</body>
</html>
